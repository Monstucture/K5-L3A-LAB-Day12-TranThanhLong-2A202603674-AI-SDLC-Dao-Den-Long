<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mây và Đêm Đảo Bến — Đêm 1: Đảo Bến</title>
<link rel="stylesheet" href="/src/game/style.css" />
</head>
<body>
  <div id="game"></div>

  <!-- HUD -->
  <div id="hud">
    <div id="hud-left">
      <div id="flames" class="hud-row" title="Sức khỏe"></div>
      <div id="carried" class="hud-row">Ánh sáng: <b id="carried-val">0</b></div>
    </div>
    <div id="hud-right">
      <div id="lantern-progress">Đèn lồng: <b id="lantern-val">0/5</b></div>
      <div id="score">Điểm: <b id="score-val">0</b></div>
      <div id="time">Đêm: <b id="time-val">5:00</b></div>
    </div>
    <div id="toast"></div>
    <div id="hint"></div>
  </div>

  <div id="intro" class="overlay">
    <h2>🌙 Mây và Đêm Đảo Bến</h2>
    <p class="sub">Nhặt <b>đom đóm</b>, nạp ánh sáng vào <b>5 Đèn Lồng Lớn</b>, tránh <b>Bóng Mực</b> để thắp sáng cả hòn đảo.</p>
    <div class="controls">
      <span><kbd>W A S D</kbd> — Di chuyển</span>
      <span><kbd>Chuột</kbd>/kéo — Xoay camera</span>
      <span><kbd>Space</kbd> — Nhảy</span>
      <span><kbd>E</kbd> — Nạp ánh sáng vào đèn</span>
      <span><kbd>F</kbd> — Tỏa sáng (đẩy lùi Bóng Mực)</span>
      <span><kbd>R</kbd> — Chơi lại</span>
    </div>
    <button id="start-btn">Bắt đầu đêm 🌌</button>
  </div>

  <div id="result" class="overlay hidden">
    <h2 id="result-title"></h2>
    <p id="result-msg"></p>
    <p class="final-score">Điểm cuối: <b id="result-score">0</b></p>
    <button id="replay-btn">Chơi lại ↺</button>
  </div>

  <script type="module" src="/src/game/main.js"></script>
</body>
</html>
